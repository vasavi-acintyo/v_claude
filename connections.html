<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connections — MedHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .statusbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 4px;font-size:15px;font-weight:700;color:var(--ink);}
  .statusbar .sys{display:flex;align-items:center;gap:7px;} .statusbar svg{fill:currentColor;stroke:currentColor;}

  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;}
  .topbar .bk{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:0 0 auto;}
  .topbar .bk:active{transform:scale(.94);}
  .topbar .tt{flex:1;min-width:0;font-size:14px;font-weight:800;font-family:var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .scroll{flex:1 1 auto;overflow-y:auto;padding:2px 18px 22px;}
  .scroll::-webkit-scrollbar{width:0;}

  .sec{margin:16px 0 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .sec h2{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .sec .cnt{font-size:9px;font-weight:800;color:var(--brand);background:var(--brand-soft);padding:3px 8px;border-radius:20px;}

  .reqs{display:flex;flex-direction:column;gap:8px;}
  .req{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 11px;cursor:pointer;transition:border-color .16s, opacity .3s ease, transform .3s ease;}
  .req:hover{border-color:var(--brand);}
  .req img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--chip);flex:0 0 auto;}
  .req .m{flex:1;min-width:0;}
  .req .nm{font-size:11.5px;font-weight:800;font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .req .sp{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .req.gone{opacity:0;transform:translateX(30px);}
  .req .kebab{border:none;cursor:pointer;background:none;color:var(--muted);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;}
  .req .kebab:hover{background:var(--chip);color:var(--ink);}
  .req .kebab svg{width:15px;height:15px;}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty svg{width:36px;height:36px;margin:0 auto 12px;opacity:.5;}
  .empty p{font-size:12px;line-height:1.6;}

  .toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--surface);font-size:11.5px;font-weight:700;padding:10px 18px;border-radius:22px;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:99;max-width:80%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- sheets ---- */
  .backdrop{position:absolute;inset:0;background:rgba(15,15,35,.45);opacity:0;visibility:hidden;transition:opacity .3s, visibility .3s;z-index:30;}
  .backdrop.open{opacity:1;visibility:visible;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .5s cubic-bezier(.34,1.3,.5,1);box-shadow:0 -12px 40px -12px rgba(0,0,0,.4);max-height:82%;overflow-y:auto;}
  .sheet::-webkit-scrollbar{width:0;}
  .sheet.open{transform:translateY(0);}
  .grab{width:38px;height:4px;background:var(--line);border-radius:3px;margin:8px auto 4px;position:sticky;top:0;}
  .sheet-body{padding:0 18px calc(20px + env(safe-area-inset-bottom));}
  .opt-item{width:100%;display:flex;align-items:center;gap:12px;background:none;border:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line);text-align:left;}
  .opt-item:last-child{border-bottom:none;}
  .opt-item svg{width:19px;height:19px;color:var(--muted);flex:0 0 auto;}
  .opt-item.danger{color:#ef4444;}
  .ma-row{display:flex;align-items:center;gap:12px;padding:2px 4px 16px;}
  .ma-row img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--chip);flex:0 0 auto;border:2px solid var(--card);}
  .ma-row .nm{font-size:13px;font-weight:800;font-family:var(--display);}
  .ma-row .sp{font-size:10.5px;color:var(--muted);margin-top:2px;}

  /* ---------- V Theme (vibrant) ---------- */
  [data-theme="vibrant"] .sec h2{position:relative;padding-left:12px;}
  [data-theme="vibrant"] .sec h2::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--brand);}
  [data-theme="vibrant"] .req{box-shadow:0 6px 16px -14px rgba(30,20,60,.16);}

  /* hide-mock-statusbar */ .statusbar{display:none !important;}
</style>
  <link rel="stylesheet" href="global.css?v=10">
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <div class="sys">
      <svg width="17" height="13" viewBox="0 0 20 14"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/></svg>
      <svg width="17" height="13" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.5C5.5 .5 12.5 .5 17 4.5"/><path d="M4 7.5C6.8 5 11.2 5 14 7.5"/><path d="M7 10.5C8.2 9.4 9.8 9.4 11 10.5"/><circle cx="9" cy="13" r=".6" fill="currentColor" stroke="none"/></svg>
      <svg width="26" height="14" viewBox="0 0 26 14"><rect x="0.5" y="0.5" width="22" height="13" rx="3.5" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="18" height="10" rx="2.2" fill="currentColor"/><rect x="23.5" y="4.5" width="2" height="5" rx="1" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <div class="topbar">
    <button class="bk" id="back" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg></button>
    <div class="tt">Connections</div>
  </div>

  <div class="scroll">
    <div class="sec rise"><h2>Your connections</h2><span class="cnt" id="connCount">0</span></div>
    <div class="reqs" id="connList"></div>
  </div>

  <!-- Connection action sheet -->
  <div class="backdrop" id="maBackdrop"></div>
  <div class="sheet" id="maSheet">
    <div class="grab"></div>
    <div class="sheet-body" id="maBody"></div>
  </div>

  <div class="home-ind"></div>
</div>

<script>
  (function(){ const ua=navigator.userAgent||''; const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); const isAndroid=/Android/.test(ua); document.documentElement.setAttribute('data-os', isIOS?'ios':isAndroid?'android':'other'); })();
  try{ const t=localStorage.getItem('cmeTheme')||'blue'; if(t&&t!=='classical') document.documentElement.setAttribute('data-theme',t); }catch(e){}

  function toast(m){ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.querySelector('.phone').appendChild(t); } t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1400); }
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('back').addEventListener('click', ()=>{ history.length>1?history.back():location.href='network.html'; });

  const dotsIco='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';
  const emptyIco='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1.5A4.5 4.5 0 0 1 7.5 14h3A4.5 4.5 0 0 1 15 18.5V20"/></svg>';

  // doctors already connected to "you" — the DIRECTORY names from Profile/CME/Network that
  // aren't currently pending invitations or "people you may know" suggestions elsewhere in the app
  const CONNECTIONS = [
    { name:'Dr. Meera Iyer', role:'Endocrinologist', hospital:'Apollo Hospitals', city:'Chennai', img:'https://randomuser.me/api/portraits/women/68.jpg' },
    { name:'Dr. Arvind Kumar', role:'Cardiologist', hospital:'Fortis Escorts', city:'Delhi', img:'https://randomuser.me/api/portraits/men/32.jpg' },
    { name:'Dr. Rohan Sinha', role:'Hypertension Specialist', hospital:'AIIMS', city:'New Delhi', img:'https://randomuser.me/api/portraits/men/45.jpg' },
    { name:'Dr. Priya Nair', role:'Lipidologist', hospital:'Narayana Health', city:'Bengaluru', img:'https://randomuser.me/api/portraits/women/44.jpg' },
    { name:'Dr. Vijay Menon', role:'Diabetologist', hospital:'Amrita Hospital', city:'Kochi', img:'https://randomuser.me/api/portraits/men/76.jpg' }
  ];

  function loadRemoved(){ try{ return JSON.parse(localStorage.getItem('removedConnections')||'[]'); }catch(e){ return []; } }
  function saveRemoved(list){ try{ localStorage.setItem('removedConnections', JSON.stringify(list)); }catch(e){} }

  function render(){
    const removed = loadRemoved();
    const list = CONNECTIONS.filter(c=>!removed.includes(c.name));
    document.getElementById('connCount').textContent = list.length;
    document.getElementById('connList').innerHTML = list.length ? list.map((c,i)=>`
      <div class="req rise" data-name="${esc(c.name)}">
        <img src="${c.img}" alt="">
        <div class="m"><div class="nm">${esc(c.name)}</div><div class="sp">${esc(c.role)} · ${esc(c.hospital)}</div></div>
        <button type="button" class="kebab" data-mkebab="${esc(c.name)}" aria-label="More options for ${esc(c.name)}">${dotsIco}</button>
      </div>`).join('') : `<div class="empty">${emptyIco}<p>No connections yet.</p></div>`;
  }

  const maBackdrop=document.getElementById('maBackdrop'), maSheet=document.getElementById('maSheet'), maBody=document.getElementById('maBody');
  let maName=null;
  function openMemberAction(name){
    const c = CONNECTIONS.find(x=>x.name===name); if(!c) return;
    maName = name;
    maBody.innerHTML = `
      <div class="ma-row"><img src="${c.img}" alt=""><div><div class="nm">${esc(c.name)}</div><div class="sp">${esc(c.role)} · ${esc(c.hospital)}</div></div></div>
      <button type="button" class="opt-item danger" id="maRemoveBtn">Remove connection</button>
      <button type="button" class="opt-item" id="maCancelBtn">Cancel</button>
    `;
    maBackdrop.classList.add('open'); maSheet.classList.add('open');
  }
  function closeMemberAction(){ maBackdrop.classList.remove('open'); maSheet.classList.remove('open'); maName=null; }
  maBackdrop.addEventListener('click', closeMemberAction);
  maBody.addEventListener('click', e=>{
    if(e.target.closest('#maCancelBtn')){ closeMemberAction(); return; }
    if(e.target.closest('#maRemoveBtn')){
      const name = maName; closeMemberAction();
      if(!confirm('Remove '+name+' from your connections?')) return;
      const removed = loadRemoved();
      if(!removed.includes(name)) removed.push(name);
      saveRemoved(removed);
      toast(name+' removed from your connections');
      const row = document.querySelector('.req[data-name="'+CSS.escape(name)+'"]');
      if(row){ row.classList.add('gone'); setTimeout(render, 280); } else { render(); }
    }
  });

  document.getElementById('connList').addEventListener('click', e=>{
    const kb=e.target.closest('[data-mkebab]');
    if(kb){ openMemberAction(kb.dataset.mkebab); return; }
    const row=e.target.closest('.req[data-name]');
    if(row){ location.href='profile.html?name='+encodeURIComponent(row.dataset.name); }
  });

  render();

  (function(){ var p=document.querySelector('.phone'),B=390; function f(){ if(innerWidth<=600){ var s=innerWidth/B; p.style.width=B+'px'; p.style.height=(innerHeight/s)+'px'; p.style.transform='scale('+s+')'; } else { p.style.transform=''; p.style.width=''; p.style.height=''; } } f(); addEventListener('resize',f); addEventListener('orientationchange',f); })();
</script>
</body>
</html>
